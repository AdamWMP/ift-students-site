<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Which Fitness Pathway Will Make You €5k/Month? | Image Fitness Training</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#D4A836', 400: '#E5B82A', 500: '#D4A836' },
            charcoal: { 700: '#434343', 800: '#383838', 900: '#1a1a1a', 950: '#0d0d0d' },
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    .slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes pop { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
    .pop { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pulse-gold { 0%, 100% { box-shadow: 0 0 0 0 rgba(212, 168, 54, 0.5); } 50% { box-shadow: 0 0 0 12px rgba(212, 168, 54, 0); } }
    .pulse-gold { animation: pulse-gold 2s ease-in-out infinite; }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin-slow { animation: spin-slow 1.4s linear infinite; }
    .btn-gold {
      background: linear-gradient(135deg, #D4A836 0%, #E5B82A 100%);
      color: #0d0d0d;
      font-weight: 700;
      border-radius: 9999px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(212, 168, 54, 0.4); }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(212, 168, 54, 0.4);
      color: #D4A836;
      font-weight: 600;
      border-radius: 9999px;
      transition: background 0.2s;
    }
    .btn-outline:hover { background: rgba(212, 168, 54, 0.1); }
    .progress-fill { background: linear-gradient(90deg, #D4A836, #E5B82A); transition: width 0.4s ease; }
    .option-card { transition: transform 0.15s, border-color 0.2s, background 0.2s; cursor: pointer; }
    .option-card:hover { transform: scale(1.01); border-color: rgba(212, 168, 54, 0.6); background: rgba(212, 168, 54, 0.05); }
    .option-card:hover .option-icon { background: rgba(212, 168, 54, 0.1); border-color: rgba(212, 168, 54, 0.3); }
    .option-card:hover .option-chevron { color: #D4A836; transform: translateX(4px); }
    input::placeholder { color: rgba(255,255,255,0.35); }
    .bar-bg { background: repeating-linear-gradient(45deg, rgba(212,168,54,0.08) 0 8px, transparent 8px 16px); }
  </style>
</head>
<body class="bg-charcoal-950 text-white min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div id="app" class="w-full max-w-[720px]"></div>

  <script>

    const questions = [
      {

          { emoji: '💰', text: 'Sign my first 10–20 paying clients', scores: { business: 3, career: 1 } },
          { emoji: '🚀', text: 'Build a full-time income from my own brand', scores: { business: 3 } },
        ],

      // CHECKPOINT 1 inserted after Q3
      {

        options: [

          { emoji: '🚪', text: "I'm qualified but can't get hired anywhere", scores: { career: 3 } },

      // CHECKPOINT 2 inserted after Q6
      {

        options: [
          { emoji: '🪴', text: 'Need the most affordable path right now', scores: { cert: 3 } },
          { emoji: '⚖️', text: "Will invest if the ROI is clear", scores: { career: 3, business: 1 } },
          { emoji: '🚀', text: 'Will invest in the best outcome — I want to win', scores: { business: 3 } },
          { emoji: '💎', text: "I'm done playing small — give me premium", scores: { business: 3 } },
        ],
      },
      {
        question: '12 months from now, the win looks like...',
        options: [
          { emoji: '🏅', text: 'Qualified, certificate in hand, working somewhere', scores: { cert: 3 } },
          { emoji: '🏟️', text: 'Employed at a great gym, steady income, loving it', scores: { career: 3 } },
          { emoji: '💵', text: '10–20 of my own paying clients, €3–5k/month', scores: { business: 3 } },
          { emoji: '🌍', text: 'A known name in Irish fitness with a brand I love', scores: { business: 3 } },
        ],
      },
    ];

    // ─── Checkpoints (storytelling interstitials) ──────────────────────
    const checkpoints = {
      3: {
        badge: 'DID YOU KNOW',
        emoji: '📊',
        headline: '72% of new PTs quit within 2 years.',
        body: "Not because they're bad coaches — because no one taught them how to get clients. The ones who last? They picked a pathway with real business training from day one.",
        cta: "OK — let's keep going",
      },
      6: {
        badge: 'GRADUATE STORY',
        emoji: '🎉',
        headline: 'James qualified in 8 weeks. Signed 5 clients in his first month.',
        body: "\"I came in just wanting the qualification. I left with a business that pays for my mortgage. The 'business' modules changed my life.\" — James, IFT graduate 2024",
        cta: "Inspiring — show me the next question",
      },
    };

    // ─── Results (3 archetypes) ────────────────────────────────────────
    const results = {
      cert: {
        archetype: 'The Qualifier',
        badge: 'Your Pathway: The Cert',
        emoji: '🎓',
        tagline: 'Your qualification. Your foundation. Your starting line.',
        price: '€2,800',
        deposit: 'from €500 deposit',
        description: "You don't need bells and whistles — you need a recognised, respected qualification so you can step confidently into the gym floor and start earning. The Cert pathway is the cleanest, most efficient route to becoming a certified Personal Trainer with REPs Ireland accreditation.",
        futurePace: "12 months from now: certificate framed, EQF Level 4 next to your name, working in a gym you love.",
        stack: [
          { feature: 'REPs Ireland-approved PT qualification (EQF Level 4)', value: '€2,000 value' },
          { feature: 'Fitness Instruction certification', value: '€400 value' },
          { feature: 'Group Instruction certification', value: '€400 value' },
          { feature: 'NutriCert Global Nutrition Diploma', value: '€750 value' },
          { feature: 'Flexible delivery — blended, scheduled, or fully online', value: 'Priceless' },
          { feature: 'Free workshops included', value: '€300 value' },
        ],
        totalValue: '€3,850',
        ctaText: 'See The Cert Pathway',
        link: 'https://imageft.ie/courses/personal-trainer#the-cert',
        social: '“I was hired at my dream gym 2 weeks after qualifying.” — Sinéad, Cert pathway 2024',
        runnerUp: { title: 'Want help getting hired too? See The Career →', link: 'https://imageft.ie/courses/personal-trainer#the-career' },
      },
      career: {
        archetype: 'The Career Climber',
        badge: 'Your Pathway: The Career',
        emoji: '🏆',
        tagline: 'Qualify. Get placed. Get hired.',
        price: '€3,500',
        deposit: 'from €500 deposit',
        description: "You don't just want a cert — you want a CAREER. You want to walk out of the course not just qualified, but placed in a gym, earning, and confident enough to actually keep clients. The Career pathway adds live job placement and the first phase of our Fitness Business Accelerator — the same playbook our graduates use to hit €3k/month within months.",
        futurePace: "12 months from now: employed at a great gym, clients booked into your diary, your confidence sky-high — and you're already thinking about how to scale further.",
        stack: [
          { feature: 'Everything in The Cert', value: '€3,850 value' },
          { feature: '3–4 week LIVE job placement (real clients, real gym)', value: '€1,500 value' },
          { feature: 'Fitness Business Accelerator Phase 1', value: '€997 value' },
          { feature: "6 months free in The Floor — Ireland's PT graduate community", value: '€600 value' },
          { feature: 'Graded result: Pass, Merit, or Distinction', value: 'CV gold' },
          { feature: 'Additional career workshops', value: '€300 value' },
        ],
        totalValue: '€7,247',
        ctaText: 'See The Career Pathway',
        link: 'https://imageft.ie/courses/personal-trainer#the-career',
        social: '“Placed at my placement gym. I never even had to apply for a job.” — Conor, Career pathway 2024',
        runnerUp: { title: 'Ready to go bigger? See The Business →', link: 'https://imageft.ie/courses/personal-trainer#the-business' },
        popular: true,
      },
      business: {
        archetype: 'The Fitness Entrepreneur',
        badge: 'Your Pathway: The Business',
        emoji: '🚀',
        tagline: 'Build the career. Then build the empire.',
        price: '€4,800',
        deposit: 'from €500 deposit',
        description: "You're not here to be average. You're here to build something that pays you €5k, €10k, €20k a month — on your terms, with your name on it. The Business pathway is our top-tier programme: every module of The Career PLUS a done-for-you brand photoshoot, AI coaching workshops, and Phase 2 of the Fitness Business Accelerator — the retention and scaling playbook that turns coaches into owners.",
        futurePace: "12 months from now: full client roster, a personal brand people recognise on Instagram, prices that reflect your skill, and the kind of income most PTs only dream about.",
        stack: [
          { feature: 'Everything in The Career', value: '€7,247 value' },
          { feature: 'Professional brand photoshoot + advertising reels (done-for-you)', value: '€1,800 value' },
          { feature: 'AI for Coaches workshop', value: '€497 value' },
          { feature: 'Programming for Success masterclass', value: '€397 value' },
          { feature: 'Fitness Business Accelerator Phase 2 (retention + scale)', value: '€1,497 value' },
          { feature: 'Priority placement — 200+ hiring partner network', value: 'Priceless' },
          { feature: 'Extended membership in The Floor community', value: '€1,200 value' },
        ],
        totalValue: '€12,638',
        ctaText: 'See The Business Pathway',
        link: 'https://imageft.ie/courses/personal-trainer#the-business',
        social: '“€8,400 in my first month after launching. The brand reels paid for the course twice over.” — Aisling, Business pathway 2024',
        runnerUp: { title: 'Not ready for premium yet? Start with The Career →', link: 'https://imageft.ie/courses/personal-trainer#the-career' },
      },
    };

    // ─── State ────────────────────────────────────────────────────────
    const state = {
      stage: 'intro', // intro | quiz | checkpoint | leadgate | calculating | result
      current: 0,
      answers: [],
      scores: { cert: 0, career: 0, business: 0 },
      lead: { name: '', email: '' },
    };

    const app = document.getElementById('app');

    function render() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (state.stage === 'intro') return renderIntro();
      if (state.stage === 'quiz') return renderQuiz();
      if (state.stage === 'checkpoint') return renderCheckpoint();
      if (state.stage === 'leadgate') return renderLeadGate();
      if (state.stage === 'calculating') return renderCalculating();
      if (state.stage === 'result') return renderResult();
    }

    // ─── INTRO (Brunson pattern interrupt) ─────────────────────────────
    function renderIntro() {
      app.innerHTML = `
        <div class="text-center fade-in">
          <div class="inline-flex items-center gap-2 px-4 py-2 bg-gold/10 border border-gold/30 rounded-full mb-6">
            <span class="text-gold">⚡</span>
            <span class="text-xs sm:text-sm text-gold font-semibold tracking-wider uppercase">60-Second Fitness Career Quiz</span>
          </div>
          <div class="flex justify-center gap-3 sm:gap-4 mb-6 text-5xl sm:text-7xl">
            <span class="pop inline-block">🎓</span>
            <span class="pop inline-block" style="animation-delay:.1s">🏆</span>
            <span class="pop inline-block" style="animation-delay:.2s">🚀</span>
          </div>
          <h1 class="text-3xl sm:text-5xl font-black mb-4 leading-tight">
            Which Fitness Pathway Will Make<br class="hidden sm:block">
            <span class="text-gold">You €5k/Month</span> in Ireland?
          </h1>
          <p class="text-white/70 text-base sm:text-lg mb-8 max-w-lg mx-auto">
            Answer 8 quick questions and we'll match you with the exact pathway used by Ireland's top-earning trainers — <span class="text-white font-semibold">The Cert</span>, <span class="text-white font-semibold">The Career</span>, or <span class="text-white font-semibold">The Business</span>.
          </p>
          <button id="start-btn" class="btn-gold inline-flex items-center gap-2 px-8 sm:px-12 py-4 text-base sm:text-lg pulse-gold mb-8">
            Take The Quiz Now
            <span>→</span>
          </button>
          <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 text-xs sm:text-sm text-white/50 mb-8">
            <div class="flex items-center gap-1.5"><span class="text-gold">✓</span> REPs Ireland Accredited</div>
            <div class="flex items-center gap-1.5"><span class="text-gold">✓</span> 4,000+ graduates since 2001</div>
            <div class="flex items-center gap-1.5"><span class="text-gold">✓</span> 100% free</div>
          </div>
          <div class="flex justify-center gap-2 text-2xl">
            <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
          </div>
          <p class="text-xs text-white/40 mt-2">Rated 4.9/5 by 1,200+ students</p>
        </div>
      `;
      document.getElementById('start-btn').addEventListener('click', () => { state.stage = 'quiz'; render(); });
    }

    // ─── QUIZ QUESTION ────────────────────────────────────────────────
    function renderQuiz() {
      const q = questions[state.current];
      const totalSteps = questions.length + Object.keys(checkpoints).length + 1; // questions + checkpoints + leadgate
      const stepsSoFar = state.current + Object.keys(checkpoints).filter(i => +i <= state.current).length;
      const progress = ((stepsSoFar + 1) / totalSteps) * 100;
      app.innerHTML = `
        <div class="slide-in">
          <div class="flex items-center gap-3 sm:gap-4 mb-6">
            <button id="back-btn" aria-label="Go back" class="w-10 h-10 rounded-full bg-charcoal-800 border border-charcoal-700/50 flex items-center justify-center text-white/70 hover:text-white hover:border-gold/50 transition flex-shrink-0">←</button>
            <div class="flex-1 h-2 bg-charcoal-800 rounded-full overflow-hidden">
              <div class="progress-fill h-full rounded-full" style="width:${progress}%"></div>
            </div>
            <div class="text-xs sm:text-sm text-white/50 font-medium flex-shrink-0 w-16 text-right">Q ${state.current + 1}/${questions.length}</div>
          </div>
          <h2 class="text-2xl sm:text-3xl font-bold mb-2 text-center">${q.question}</h2>
          ${q.subtitle ? `<p class="text-white/50 text-center mb-8">${q.subtitle}</p>` : `<div class="mb-8"></div>`}
          <div class="space-y-3">
            ${q.options.map((opt, i) => `
              <button data-idx="${i}" class="option-card w-full text-left p-4 bg-charcoal-800/60 rounded-2xl border border-charcoal-700/50 flex items-center gap-4">
                <div class="option-icon w-14 h-14 rounded-xl bg-charcoal-900/80 border border-charcoal-700/50 flex items-center justify-center text-3xl flex-shrink-0 transition">${opt.emoji}</div>
                <span class="flex-1 text-white/90 text-base sm:text-lg font-medium leading-snug">${opt.text}</span>
                <span class="option-chevron text-white/30 text-xl transition">›</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('back-btn').addEventListener('click', goBack);
      document.querySelectorAll('[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => answer(parseInt(btn.getAttribute('data-idx'), 10)));
      });
    }

    function answer(idx) {
      const opt = questions[state.current].options[idx];
      for (const [k, v] of Object.entries(opt.scores)) state.scores[k] = (state.scores[k] || 0) + v;
      state.answers.push(idx);
      const nextIndex = state.current + 1;
      // Inject checkpoints after Q3 and Q6 (i.e. before Q4 and Q7)
      if (checkpoints[nextIndex]) {
        state.stage = 'checkpoint';
        state.checkpointFor = nextIndex;
        return render();
      }
      if (nextIndex >= questions.length) {
        state.stage = 'leadgate';
        return render();
      }
      state.current = nextIndex;
      render();
    }

    function goBack() {
      if (state.current > 0) {
        const prevIdx = state.answers.pop();
        const prevOpt = questions[state.current - 1].options[prevIdx];
        for (const [k, v] of Object.entries(prevOpt.scores)) state.scores[k] = (state.scores[k] || 0) - v;
        state.current -= 1;
        render();
      } else {
        state.stage = 'intro';
        render();
      }
    }

    // ─── CHECKPOINT (storytelling interstitial) ────────────────────────
    function renderCheckpoint() {
      const cp = checkpoints[state.checkpointFor];
      app.innerHTML = `
        <div class="text-center fade-in py-8">
          <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-gold/10 border border-gold/30 rounded-full mb-6">
            <span class="text-xs text-gold font-bold tracking-wider">${cp.badge}</span>
          </div>
          <div class="w-28 h-28 mx-auto mb-6 bg-gradient-to-br from-gold/30 to-gold/10 rounded-full flex items-center justify-center text-6xl pop">${cp.emoji}</div>
          <h2 class="text-2xl sm:text-4xl font-black mb-5 leading-tight max-w-xl mx-auto">${cp.headline}</h2>
          <p class="text-white/70 text-base sm:text-lg leading-relaxed mb-10 max-w-lg mx-auto">${cp.body}</p>
          <button id="cp-continue" class="btn-gold inline-flex items-center gap-2 px-8 py-4">
            ${cp.cta}
            <span>→</span>
          </button>
        </div>
      `;
      document.getElementById('cp-continue').addEventListener('click', () => {
        state.current = state.checkpointFor;
        state.stage = 'quiz';
        render();
      });
    }

    // ─── LEAD GATE (Brunson email capture before result) ───────────────
    function renderLeadGate() {
      app.innerHTML = `
        <div class="fade-in">
          <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-gold/10 border border-gold/30 rounded-full mb-5">
              <span class="text-xs text-gold font-bold tracking-wider">ALMOST THERE</span>
            </div>
            <div class="w-20 h-20 mx-auto mb-5 bg-gradient-to-br from-gold/30 to-gold/10 rounded-full flex items-center justify-center text-4xl pop">🎁</div>
            <h2 class="text-3xl sm:text-4xl font-black mb-3 leading-tight">Your personalised pathway is ready.</h2>
            <p class="text-white/70 text-base sm:text-lg max-w-md mx-auto">Tell us where to send your <span class="text-white font-semibold">free Pathway Roadmap PDF</span> — including next intake dates and payment plan options.</p>
          </div>
          <form id="lead-form" class="bg-charcoal-800/60 rounded-2xl border border-charcoal-700/50 p-5 sm:p-6 space-y-3">
            <input id="lead-name" type="text" placeholder="Your first name" required
              class="w-full bg-charcoal-900/80 border border-charcoal-700/50 rounded-xl px-4 py-3.5 text-white focus:border-gold/60 focus:outline-none focus:ring-2 focus:ring-gold/20" />
            <input id="lead-email" type="email" placeholder="Your best email" required
              class="w-full bg-charcoal-900/80 border border-charcoal-700/50 rounded-xl px-4 py-3.5 text-white focus:border-gold/60 focus:outline-none focus:ring-2 focus:ring-gold/20" />
            <button type="submit" class="btn-gold w-full py-4 inline-flex items-center justify-center gap-2 text-lg">
              Reveal My Pathway
              <span>→</span>
            </button>
            <div class="flex items-center justify-center gap-1.5 text-xs text-white/40 pt-1">
              <span>🔒</span><span>100% private. No spam. Unsubscribe anytime.</span>
            </div>
          </form>
          <div class="text-center mt-4">
            <button id="lead-skip" class="text-sm text-white/40 hover:text-white/70 transition">Skip — just show me my result</button>
          </div>
        </div>
      `;
      document.getElementById('lead-form').addEventListener('submit', (e) => {
        e.preventDefault();
        state.lead.name = document.getElementById('lead-name').value.trim();
        state.lead.email = document.getElementById('lead-email').value.trim();
        state.stage = 'calculating';
        render();
      });
      document.getElementById('lead-skip').addEventListener('click', () => {
        state.stage = 'calculating';
        render();
      });
    }

    // ─── CALCULATING (Brunson reveal anticipation) ─────────────────────
    function renderCalculating() {
      app.innerHTML = `
        <div class="fade-in text-center py-12">
          <div class="w-20 h-20 mx-auto mb-6 border-4 border-charcoal-700 border-t-gold rounded-full spin-slow"></div>
          <h2 class="text-2xl sm:text-3xl font-bold mb-3">Analysing your answers${state.lead.name ? `, ${escapeHtml(state.lead.name)}` : ''}…</h2>
          <p class="text-white/60 text-base sm:text-lg max-w-md mx-auto" id="calc-msg">Matching your profile against 4,000+ IFT graduates…</p>
        </div>
      `;
      const msgs = [
        'Matching your profile against 4,000+ IFT graduates…',
        'Calculating your Cert / Career / Business fit…',
        'Cross-referencing your goals with our top earners…',
        'Locking in your personalised pathway…',
      ];
      let i = 0;
      const el = document.getElementById('calc-msg');
      const interval = setInterval(() => {
        i++;
        if (!el) { clearInterval(interval); return; }
        if (i < msgs.length) {
          el.textContent = msgs[i];
        }
      }, 700);
      setTimeout(() => {
        clearInterval(interval);
        state.stage = 'result';
        render();
      }, 2800);
    }

    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

    // ─── RESULT (Brunson identity + offer stack + urgency) ─────────────
    function getWinner() {
      const sorted = Object.entries(state.scores).sort((a, b) => b[1] - a[1]);
      return sorted[0][0];
    }

    function nextIntake() {
      const dates = [
        { label: '27 April 2026', city: 'Dublin (Swords & Tallaght)' },
        { label: '25 April 2026', city: 'Cork, Galway, Limerick & Wexford' },
        { label: '2 July 2026', city: 'All locations — 8-Week Full Time' },
      ];
      return dates[0];
    }

    function renderResult() {
      const winnerKey = getWinner();
      const r = results[winnerKey];
      const total = state.scores.cert + state.scores.career + state.scores.business;
      const pct = {
        cert: total > 0 ? Math.round((state.scores.cert / total) * 100) : 0,
        career: total > 0 ? Math.round((state.scores.career / total) * 100) : 0,
        business: total > 0 ? Math.round((state.scores.business / total) * 100) : 0,
      };
      const intake = nextIntake();
      const firstName = state.lead.name ? escapeHtml(state.lead.name) : 'you';

      app.innerHTML = `
        <div class="fade-in">
          <div class="text-center mb-8">
            <div class="w-28 h-28 mx-auto mb-5 bg-gradient-to-br from-gold/30 to-gold/10 rounded-full flex items-center justify-center text-6xl pop">${r.emoji}</div>
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-gold/10 border border-gold/30 rounded-full mb-4">
              <span class="text-xs text-gold font-bold tracking-wider">${r.badge.toUpperCase()}</span>
            </div>
            <p class="text-white/60 text-sm mb-2">${state.lead.name ? `${firstName}, you are…` : 'You are…'}</p>
            <h1 class="text-4xl sm:text-6xl font-black mb-3">${r.archetype}</h1>
            <p class="text-white/70 text-lg sm:text-xl italic">${r.tagline}</p>
            ${r.popular ? `<div class="mt-4 inline-block px-3 py-1 bg-gold text-black text-xs font-black rounded-full">⭐ MOST POPULAR PATHWAY</div>` : ''}
          </div>

          <!-- Match breakdown -->
          <div class="bg-charcoal-800/50 rounded-2xl p-5 border border-charcoal-700/50 mb-6">
            <p class="text-xs text-white/40 uppercase tracking-wider font-bold text-center mb-4">Your Pathway Match</p>
            <div class="space-y-3">
              ${renderBar('🎓 The Cert', pct.cert, winnerKey === 'cert')}
              ${renderBar('🏆 The Career', pct.career, winnerKey === 'career')}
              ${renderBar('🚀 The Business', pct.business, winnerKey === 'business')}
            </div>
          </div>

          <!-- Description + future pace -->
          <div class="bg-gradient-to-br from-charcoal-800/80 to-charcoal-900/80 rounded-2xl p-6 sm:p-8 border border-gold/30 mb-6">
            <p class="text-white/85 text-base sm:text-lg leading-relaxed mb-5">${r.description}</p>
            <div class="bg-gold/5 border border-gold/20 rounded-xl p-4 mb-6">
              <p class="text-xs text-gold font-bold uppercase tracking-wider mb-1">🔮 12-Month Future Pace</p>
              <p class="text-white/90 italic">${r.futurePace}</p>
            </div>

            <!-- Offer Stack -->
            <p class="text-xs text-white/40 uppercase tracking-wider font-bold mb-3">What's Included</p>
            <div class="space-y-2 mb-5">
              ${r.stack.map(item => `
                <div class="flex items-start gap-3 py-2.5 border-b border-charcoal-700/40 last:border-0">
                  <div class="w-5 h-5 rounded-full bg-gold/20 flex items-center justify-center flex-shrink-0 mt-0.5">
                    <span class="text-gold text-xs">✓</span>
                  </div>
                  <span class="flex-1 text-white/85 text-sm leading-snug">${item.feature}</span>
                  <span class="text-gold/70 text-xs font-semibold whitespace-nowrap">${item.value}</span>
                </div>
              `).join('')}
            </div>

            <!-- Value Stack -->
            <div class="bg-charcoal-950/60 rounded-xl p-4 mb-6 border border-charcoal-700/40">
              <div class="flex justify-between items-center mb-2">
                <span class="text-white/60 text-sm">Total value</span>
                <span class="text-white/60 line-through">${r.totalValue}</span>
              </div>
              <div class="flex justify-between items-baseline">
                <span class="text-white font-bold text-lg">Your investment</span>
                <div class="text-right">
                  <div class="text-3xl font-black text-gold">${r.price}</div>
                  <div class="text-xs text-white/50">${r.deposit}</div>
                </div>
              </div>
            </div>

            <!-- Urgency -->
            <div class="bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3 mb-6 flex items-center gap-3">
              <span class="text-2xl">⏰</span>
              <div>
                <div class="text-white font-semibold text-sm">Next intake: ${intake.label}</div>
                <div class="text-white/50 text-xs">${intake.city} — limited seats</div>
              </div>
            </div>

            <!-- CTAs -->
            <div class="flex flex-col sm:flex-row gap-3">
              <a href="${r.link}" class="btn-gold flex items-center justify-center gap-2 flex-1 py-4 text-base">
                ${r.ctaText}
                <span>→</span>
              </a>
              <a href="https://imageft.ie/contact" class="btn-outline flex items-center justify-center gap-2 flex-1 py-4 text-base">
                Book a Free 15-Min Call
              </a>
            </div>

            <!-- Risk reversal -->
            <p class="text-center text-xs text-white/40 mt-4">
              🔒 100% REPs Ireland accredited &nbsp;•&nbsp; Payment plans available &nbsp;•&nbsp; Skillnet funding eligible
            </p>
          </div>

          <!-- Social proof -->
          <div class="bg-charcoal-800/40 rounded-2xl p-5 border border-charcoal-700/50 mb-6">
            <div class="flex gap-1 mb-2">
              <span class="text-gold">⭐</span><span class="text-gold">⭐</span><span class="text-gold">⭐</span><span class="text-gold">⭐</span><span class="text-gold">⭐</span>
            </div>
            <p class="text-white/85 italic text-sm sm:text-base leading-relaxed">${r.social}</p>
          </div>

          <!-- Runner-up + restart -->
          <div class="text-center">
            <a href="${r.runnerUp.link}" class="inline-block px-5 py-2.5 bg-charcoal-800/50 border border-charcoal-700/50 rounded-full text-white/70 text-sm hover:border-gold/30 hover:text-gold transition mb-6">
              ${r.runnerUp.title}
            </a>
            <div>
              <button id="restart-btn" class="flex items-center gap-2 text-white/50 hover:text-white transition mx-auto text-sm">
                <span>↻</span><span>Retake the quiz</span>
              </button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('restart-btn').addEventListener('click', () => {
        state.stage = 'intro';
        state.current = 0;
        state.answers = [];
        state.scores = { cert: 0, career: 0, business: 0 };
        state.lead = { name: '', email: '' };
        render();
      });
    }

    function renderBar(label, pct, isWinner) {
      return `
        <div>
          <div class="flex justify-between text-sm mb-1.5">
            <span class="text-white/80 font-medium">${label}</span>
            <span class="${isWinner ? 'text-gold font-bold' : 'text-white/60'}">${pct}%${isWinner ? ' ★' : ''}</span>
          </div>
          <div class="h-2 bg-charcoal-900 rounded-full overflow-hidden">
            <div class="${isWinner ? 'progress-fill' : 'bg-charcoal-700'} h-full" style="width:${pct}%"></div>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
